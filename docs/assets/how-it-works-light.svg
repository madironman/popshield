<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d">
  <title id="t">How PopShield decides</title>
  <desc id="d">A request to open a tab passes four checks: real gesture, full click, listener on a specific element, visible target. If all pass, the tab opens. If any fails, it is blocked and listed in the popup.</desc>
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.a{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.pop{transform-box:fill-box;transform-origin:center}@keyframes ak0{0%{opacity:0} 7%{opacity:0} 8%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes aa0{0%{opacity:0} 4%{opacity:0} 5%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes ak1{0%{opacity:0} 14%{opacity:0} 15%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes aa1{0%{opacity:0} 11%{opacity:0} 12%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes ak2{0%{opacity:0} 21%{opacity:0} 22%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes aa2{0%{opacity:0} 18%{opacity:0} 19%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes ak3{0%{opacity:0} 28%{opacity:0} 29%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes aa3{0%{opacity:0} 25%{opacity:0} 26%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes aa4{0%{opacity:0} 32%{opacity:0} 33%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes allow{0%{opacity:0} 35%{opacity:0} 36%{opacity:1} 46%{opacity:1} 47%{opacity:0} 100%{opacity:0}}@keyframes bk0{0%{opacity:0} 57%{opacity:0} 58%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes ba0{0%{opacity:0} 54%{opacity:0} 55%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes bk1{0%{opacity:0} 64%{opacity:0} 65%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes ba1{0%{opacity:0} 61%{opacity:0} 62%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes ba2{0%{opacity:0} 68%{opacity:0} 69%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes bx2{0%{opacity:0} 71%{opacity:0} 72%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes bdown{0%{opacity:0} 75%{opacity:0} 76%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes block{0%{opacity:0} 79%{opacity:0} 80%{opacity:1} 96%{opacity:1} 97%{opacity:0} 100%{opacity:0}}@keyframes capA{0%{opacity:0} 1%{opacity:1} 47%{opacity:1} 48%{opacity:0} 100%{opacity:0}}@keyframes capB{0%{opacity:0} 50%{opacity:0} 51%{opacity:1} 97%{opacity:1} 98%{opacity:0} 100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.0}50%{opacity:.9}}@media (prefers-reduced-motion: reduce){.a{animation:none!important}.rm-hide{opacity:0}}</style>
  <rect width="960" height="476" rx="16" fill="#ffffff"/>
  <text x="16" y="34" font-size="13" font-weight="700" fill="#57606a" letter-spacing="1.2">EVERY ATTEMPT TO OPEN A TAB PASSES THROUGH FOUR CHECKS</text><g class="a rm-hide" style="animation-name:capA"><circle cx="24" cy="66" r="6" fill="#1a7f37"/><text x="38" y="71" font-size="15" fill="#1f2328">Example: you click a “Share” button. Its click listener is on the button itself.</text></g><g class="a rm-hide" style="animation-name:capB"><circle cx="24" cy="66" r="6" fill="#cf222e"/><text x="38" y="71" font-size="15" fill="#1f2328">Example: you click anywhere on the page. An ad script hooked every click on the document.</text></g><rect x="16" y="104" width="124" height="128" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="30" y="135" font-size="15" font-weight="700" fill="#1f2328">Page asks</text><text x="30" y="154" font-size="15" font-weight="700" fill="#1f2328">for a new tab</text><text class="mono" x="30" y="176" font-size="11.5" fill="#57606a">window.open()</text><text class="mono" x="30" y="194" font-size="11.5" fill="#57606a">link.click()</text><text class="mono" x="30" y="212" font-size="11.5" fill="#57606a">form.submit()</text><rect x="158" y="104" width="146" height="128" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><circle cx="182" cy="130" r="11" fill="#1a73e8"/><text x="182" y="134.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="172" y="164" font-size="15" font-weight="700" fill="#1f2328">Real gesture?</text><text x="172" y="186" font-size="12.5" fill="#57606a">Trusted click, key</text><text x="172" y="203" font-size="12.5" fill="#57606a">press or submit</text><text x="172" y="220" font-size="12.5" fill="#57606a">in progress</text><rect x="322" y="104" width="146" height="128" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><circle cx="346" cy="130" r="11" fill="#1a73e8"/><text x="346" y="134.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="336" y="164" font-size="15" font-weight="700" fill="#1f2328">Full click?</text><text x="336" y="186" font-size="12.5" fill="#57606a">A click, not just</text><text x="336" y="203" font-size="12.5" fill="#57606a">mousedown or</text><text x="336" y="220" font-size="12.5" fill="#57606a">pointerdown</text><rect x="486" y="104" width="146" height="128" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><circle cx="510" cy="130" r="11" fill="#1a73e8"/><text x="510" y="134.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="500" y="164" font-size="15" font-weight="700" fill="#1f2328">On an element?</text><text x="500" y="186" font-size="12.5" fill="#57606a">Listener is not on</text><text x="500" y="203" font-size="12.5" fill="#57606a">window, document,</text><text x="500" y="220" font-size="12.5" fill="#57606a">&lt;html&gt; or &lt;body&gt;</text><rect x="650" y="104" width="146" height="128" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><circle cx="674" cy="130" r="11" fill="#1a73e8"/><text x="674" y="134.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="664" y="164" font-size="15" font-weight="700" fill="#1f2328">Real target?</text><text x="664" y="186" font-size="12.5" fill="#57606a">Not an invisible</text><text x="664" y="203" font-size="12.5" fill="#57606a">overlay or a top</text><text x="664" y="220" font-size="12.5" fill="#57606a">z-index ad layer</text><rect x="814" y="104" width="124" height="128" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><rect class="a rm-hide" style="animation-name:allow" x="810" y="100" width="132" height="136" rx="15" fill="none" stroke="#1a7f37" stroke-width="3"/><circle cx="876.0" cy="142" r="16" fill="#1a7f37"/><path d="M869.0 142 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="876.0" y="182" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">Allowed</text><text x="876.0" y="203" font-size="12.5" fill="#57606a" text-anchor="middle">the tab opens</text><g ><path d="M142 168.0 H154" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/><path d="M149 163.0 L156 168.0 L149 173.0" fill="none" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g ><path d="M306 168.0 H318" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/><path d="M313 163.0 L320 168.0 L313 173.0" fill="none" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g ><path d="M470 168.0 H482" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/><path d="M477 163.0 L484 168.0 L477 173.0" fill="none" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g ><path d="M634 168.0 H646" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/><path d="M641 163.0 L648 168.0 L641 173.0" fill="none" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g ><path d="M798 168.0 H810" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/><path d="M805 163.0 L812 168.0 L805 173.0" fill="none" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:aa0"><path d="M142 168.0 H154" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M149 163.0 L156 168.0 L149 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ba0"><path d="M142 168.0 H154" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M149 163.0 L156 168.0 L149 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:aa1"><path d="M306 168.0 H318" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M313 163.0 L320 168.0 L313 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ba1"><path d="M306 168.0 H318" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M313 163.0 L320 168.0 L313 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:aa2"><path d="M470 168.0 H482" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M477 163.0 L484 168.0 L477 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ba2"><path d="M470 168.0 H482" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M477 163.0 L484 168.0 L477 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:aa3"><path d="M634 168.0 H646" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M641 163.0 L648 168.0 L641 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:aa4"><path d="M798 168.0 H810" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/><path d="M805 163.0 L812 168.0 L805 173.0" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ak0"><circle cx="290" cy="116" r="11" fill="#1a7f37"/><path d="M285 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ak1"><circle cx="454" cy="116" r="11" fill="#1a7f37"/><path d="M449 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ak2"><circle cx="618" cy="116" r="11" fill="#1a7f37"/><path d="M613 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:ak3"><circle cx="782" cy="116" r="11" fill="#1a7f37"/><path d="M777 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:bk0"><circle cx="290" cy="116" r="11" fill="#1a7f37"/><path d="M285 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a rm-hide" style="animation-name:bk1"><circle cx="454" cy="116" r="11" fill="#1a7f37"/><path d="M449 117 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect class="a rm-hide" style="animation-name:bx2" x="482" y="100" width="154" height="136" rx="15" fill="none" stroke="#cf222e" stroke-width="3"/><g class="a rm-hide" style="animation-name:bx2"><circle cx="618" cy="116" r="11" fill="#cf222e"/><path d="M614 112 l8 8 m0 -8 l-8 8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/></g><path d="M231.0 235 V286" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><path d="M226.0 280 L231.0 287 L236.0 280" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="239.0" y="266.0" font-size="12" fill="#57606a">no</text><path d="M395.0 235 V286" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><path d="M390.0 280 L395.0 287 L400.0 280" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="403.0" y="266.0" font-size="12" fill="#57606a">no</text><path d="M559.0 235 V286" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><path d="M554.0 280 L559.0 287 L564.0 280" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="567.0" y="266.0" font-size="12" fill="#57606a">no</text><path d="M723.0 235 V286" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/><path d="M718.0 280 L723.0 287 L728.0 280" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="731.0" y="266.0" font-size="12" fill="#57606a">no</text><g class="a rm-hide" style="animation-name:bdown"><path d="M559.0 235 V286" stroke="#cf222e" stroke-width="3"/><path d="M553.0 279 L559.0 287 L565.0 279" fill="none" stroke="#cf222e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="158" y="290" width="638" height="62" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><rect class="a rm-hide" style="animation-name:block" x="154" y="286" width="646" height="70" rx="15" fill="none" stroke="#cf222e" stroke-width="3"/><circle cx="188" cy="321.0" r="14" fill="#cf222e"/><path d="M183 316.0 l10 10 m0 -10 l-10 10" stroke="#ffebe9" stroke-width="3" stroke-linecap="round"/><text x="214" y="317" font-size="15" font-weight="700" fill="#cf222e">Blocked</text><text x="214" y="337" font-size="13" fill="#57606a">Listed in the toolbar popup with the reason and an Open button. The badge count goes up.</text><text x="16" y="384" font-size="12" font-weight="700" fill="#57606a" letter-spacing="1.2">REFINEMENTS</text><rect x="16" y="395" width="92" height="21" rx="10.5" fill="#ddf4ff"/><text x="62" y="410" font-size="12" font-weight="700" fill="#1a73e8" text-anchor="middle">Frameworks</text><text x="120" y="410" font-size="13" fill="#1f2328">React ≤16, React 17+ and jQuery .on(selector): the clicked element’s own handler passes check 3.</text><rect x="16" y="421" width="92" height="21" rx="10.5" fill="#ddf4ff"/><text x="62" y="436" font-size="12" font-weight="700" fill="#1a73e8" text-anchor="middle">After await</text><text x="120" y="436" font-size="13" fill="#1f2328">V8 async stack shows HTMLButtonElement → allowed. HTMLDocument / Window, timers and .then() → blocked.</text><rect x="16" y="447" width="92" height="21" rx="10.5" fill="#ddf4ff"/><text x="62" y="462" font-size="12" font-weight="700" fill="#1a73e8" text-anchor="middle">Tab-under</text><text x="120" y="462" font-size="13" fill="#1f2328">Re-opening this same page in a new tab, or a cross-site redirect after a new tab until your next click (up to 60 s) → blocked.</text>
</svg>
