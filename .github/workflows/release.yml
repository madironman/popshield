name: Release

# Runs when a version tag (vX.Y.Z) is pushed. Checks that the tag matches the
# version in manifest.json / package.json / package-lock.json and CHANGELOG.md,
# runs the full test suite, builds the Chrome Web Store zip and publishes a
# GitHub Release with the zip, its SHA-256 checksum, a build-provenance
# attestation and the CHANGELOG notes. Uploading to the Chrome Web Store stays
# a manual step (see docs/RELEASING.md).
#
# Hardening: actions are pinned to full commit SHAs (Dependabot keeps them
# current); the job that runs third-party code (npm, Playwright) has a
# read-only token and no persisted credentials; only the small publish job can
# write, and it runs nothing but `gh release`.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history: check that the tag is on main
          persist-credentials: false

      - name: Tag must point to a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::This tag is not on main. Releases are cut from main only."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Check version, tag and CHANGELOG agree
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build extension zip and checksum
        run: |
          node scripts/package.mjs
          version="${GITHUB_REF_NAME#v}"
          cd dist
          test -f "popshield-$version.zip"
          sha256sum "popshield-$version.zip" > "popshield-$version.zip.sha256"
          cat "popshield-$version.zip.sha256"
          cp "$RUNNER_TEMP/release-notes.md" release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: dist/popshield-*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/popshield-$version.zip" \
            "dist/popshield-$version.zip.sha256" \
            --verify-tag \
            --title "PopShield $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
