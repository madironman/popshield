name: Feature request
description: Suggest an improvement to PopShield.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PopShield stays small and private: no remote filter lists, no network requests, no telemetry.
        Requests that need those will be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should PopShield behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: policy
    attributes:
      label: Project policy
      options:
        - label: This does not need network access, remote code or telemetry.
          required: true
